[Extension]
Name = webui-prompt-expansion

; Wildcards are resolved first, then the resolved prompt is expanded.
; Forge's own comment remover must also run first: after us it would cut a written paragraph at "#" or "//".
; Forge names an extension after its folder: this section applies when the folder is "webui-prompt-expansion".
; The folder name is also the fallback: Forge runs extensions in the alphabetical order of their folders,
; so a "w" name runs after "sd-..." and "neo-..." wildcard extensions that this file does not list.
[callbacks/webui-prompt-expansion/prompt_expansion.py/script_process/PromptExpansionScript]
After = sd-dynamic-prompts/dynamic_prompting.py/script_process/Script, base/comments.py/script_process/ScriptComments
